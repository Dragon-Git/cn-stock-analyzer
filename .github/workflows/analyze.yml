name: Analyze & upload reports to IMA

on:
  schedule:
    # 周一到周五, 5 个时段 (对齐 src/config.py::TIME_SLOTS)
    # cron 是 UTC; 北京时间 = UTC+8
    - cron: '0 0 * * 1-5'        # 08:00 北京 — pre_market
    - cron: '35 1 * * 1-5'       # 09:35 北京 — post_auction
    - cron: '35 3 * * 1-5'       # 11:35 北京 — noon
    - cron: '10 7 * * 1-5'       # 15:10 北京 — post_close
    - cron: '35 7 * * 1-5'       # 15:35 北京 — evening
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot to run (e.g. post_close, all)'
        required: false
        default: 'all'

concurrency:
  group: analyze-${{ github.event.schedule }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: 'requirements.txt'

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Determine slot
        id: slot
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_SCHEDULE: ${{ github.event.schedule }}
          GH_INPUT_SLOT: ${{ inputs.slot }}
        run: |
          python3 - <<'PY'
          import os, json
          CRON_MAP = {
              "0 0 * * 1-5":  "pre_market",
              "35 1 * * 1-5": "post_auction",
              "35 3 * * 1-5": "noon",
              "10 7 * * 1-5": "post_close",
              "35 7 * * 1-5": "evening",
          }
          if os.environ["GH_EVENT"] == "workflow_dispatch":
              slot = os.environ.get("GH_INPUT_SLOT", "all") or "all"
          else:
              slot = CRON_MAP.get(os.environ["GH_SCHEDULE"], "all")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"slot={slot}\n")
          print(f"Running slot: {slot}")
          PY

      - name: Run analyzer
        run: |
          python -m src.analyzer --slot "${{ steps.slot.outputs.slot }}"

      - name: List generated reports
        if: always()
        run: |
          echo "=== reports/ ==="
          ls -la reports/ || true
          echo "=== latest_*.md ==="
          for f in reports/latest_*.md; do
            [ -f "$f" ] || continue
            echo "--- $f ($(wc -c < "$f") bytes) ---"
            head -3 "$f"
          done

      - name: Upload reports to IMA notes
        if: always()
        env:
          IMA_CLIENT_ID: ${{ secrets.IMA_CLIENT_ID }}
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}
        run: |
          set -e
          SLOT="${{ steps.slot.outputs.slot }}"
          DATE=$(date -u +%Y-%m-%d)
          TS=$(date -u +%H%M%S)
          # 每轮每个 slot 的 latest_{slot}.md 作为一篇新笔记推送到 IMA
          for f in reports/latest_*.md; do
            [ -f "$f" ] || continue
            # 从文件名提取 slot: latest_post_close.md → post_close
            SLOT_FROM_FILE=$(basename "$f" .md | sed 's/^latest_//')
            # 优先用 action 的 slot, 但每个 latest_*.md 也各自上传 (--slot all 会跑 5 轮)
            TITLE="cn-stock-analyzer ${SLOT_FROM_FILE} ${DATE} ${TS}"
            echo ">>> Uploading $f → $TITLE"
            python3 scripts/ima_upload.py "$f" --title "$TITLE"
          done

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ steps.slot.outputs.slot }}-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
